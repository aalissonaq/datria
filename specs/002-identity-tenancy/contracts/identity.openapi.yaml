openapi: 3.1.0
info:
  title: Datria Identity and Tenancy API
  version: 0.2.0
  description: Contrato inicial da feature 002-identity-tenancy.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Auth
  - name: Contexts
  - name: Organizations
  - name: Invitations
  - name: Platform
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      operationId: issueCsrfToken
      security: []
      responses:
        '200':
          description: Emite o cookie CSRF e devolve o valor que deve ser enviado no cabeçalho
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
                    minLength: 32
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Solicitação aceita sem enumerar contas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: E-mail verificado
        '400':
          $ref: '#/components/responses/InvalidToken'
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Resposta neutra, independentemente da existência da conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada; tokens enviados em cookies HttpOnly
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security:
        - refreshCookie: []
          csrf: []
      responses:
        '204':
          description: Tokens rotacionados
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - accessCookie: []
          csrf: []
      responses:
        '204':
          description: Sessão revogada e cookies removidos
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Resposta neutra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Senha alterada e sessões revogadas
        '400':
          $ref: '#/components/responses/InvalidToken'
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      security:
        - accessCookie: []
      responses:
        '200':
          description: Identidade autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/contexts:
    get:
      tags: [Contexts]
      operationId: listContexts
      security:
        - accessCookie: []
      responses:
        '200':
          description: Contexto pessoal e organizações disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Context'
  /organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      security:
        - accessCookie: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organização e membership administrativa criadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationError'
  /organizations/{organizationId}/members:
    get:
      tags: [Organizations]
      operationId: listMembers
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Memberships visíveis ao administrador autorizado
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{organizationId}/members/{membershipId}:
    patch:
      tags: [Organizations]
      operationId: updateMembership
      security:
        - accessCookie: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRequest'
      responses:
        '200':
          description: Status e/ou papéis atualizados
        '409':
          description: Operação violaria regra do último administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{organizationId}/invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      security:
        - accessCookie: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Convite criado
        '404':
          $ref: '#/components/responses/NotFound'
  /invitations/accept:
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      security:
        - accessCookie: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Membership criada ou ativada
        '400':
          $ref: '#/components/responses/InvalidToken'
  /organizations/{organizationId}/invitations/{invitationId}/resend:
    post:
      tags: [Invitations]
      operationId: resendInvitation
      security:
        - accessCookie: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '202':
          description: Convite pendente reenviado com política de expiração aplicada
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{organizationId}/invitations/{invitationId}/revoke:
    post:
      tags: [Invitations]
      operationId: revokeInvitation
      security:
        - accessCookie: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Convite revogado
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/organizations:
    get:
      tags: [Platform]
      operationId: listPlatformOrganizations
      security:
        - accessCookie: []
      responses:
        '200':
          description: Lista operacional para Admin SaaS
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/organizations/{organizationId}/status:
    patch:
      tags: [Platform]
      operationId: updateOrganizationStatus
      security:
        - accessCookie: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationStatusRequest'
      responses:
        '200':
          description: Status institucional atualizado e auditado
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: datria_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: datria_refresh
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password, termsVersion]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        termsVersion:
          type: string
          minLength: 1
          maxLength: 40
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
    ResetPasswordRequest:
      allOf:
        - $ref: '#/components/schemas/TokenRequest'
        - type: object
          required: [password]
          properties:
            password:
              type: string
              minLength: 8
              maxLength: 128
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug, timezone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 80
        timezone:
          type: string
          maxLength: 100
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, roles]
      properties:
        email:
          type: string
          format: email
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [INSTITUTION_ADMIN, TEACHER, REVIEWER, PARTICIPANT]
    UpdateMembershipRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, REMOVED]
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [INSTITUTION_ADMIN, TEACHER, REVIEWER, PARTICIPANT]
    UpdateOrganizationStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DISABLED]
        reason:
          type: string
          minLength: 5
          maxLength: 500
    AuthUserResponse:
      type: object
      additionalProperties: false
      required: [id, displayName, email, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [ACTIVE]
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, timezone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DISABLED]
        timezone:
          type: string
    Context:
      type: object
      additionalProperties: false
      required: [type, label]
      properties:
        type:
          type: string
          enum: [PERSONAL, ORGANIZATION]
        label:
          type: string
        organizationId:
          type: [string, 'null']
          format: uuid
        roles:
          type: array
          items:
            type: string
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [status, code, message, correlationId, timestamp]
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
  responses:
    ValidationError:
      description: Entrada inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: Credenciais inválidas sem enumeração
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidToken:
      description: Token inválido, expirado, revogado ou consumido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Autenticação ausente, expirada ou revogada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Operação não autorizada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso inexistente ou inacessível
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Limite temporário atingido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
